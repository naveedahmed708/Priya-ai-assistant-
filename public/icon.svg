<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Outer HUD Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="12 16"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#2563eb" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6" filter="url(#glow)"/>

  <!-- Glowing Core Orb -->
  <circle cx="256" cy="256" r="120" fill="#0b1329" stroke="url(#cyanGrad)" stroke-width="6"/>

  <!-- Central Letter P -->
  <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#glow)">P</text>

  <!-- Priya Subtext -->
  <text x="256" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="6" fill="#38bdf8" text-anchor="middle">PRIYA</text>
</svg>
